name: Nifty500 Daily Scan
on:
  schedule:
    - cron: '45 3 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install libs
        run: pip install yfinance pandas openpyxl lxml
      - name: Run Scanner
        run: python scanner.py
      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: Nifty500-PRD-Excel
          path: "*.xlsx"
